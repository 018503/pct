<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Evolutions &mdash; Stat &amp; Ability Comparison</title>
<style>
:root {
  --bg:#0e1219;--surface:#161c25;--surface-hover:#1c2330;--border:#2a3240;
  --text:#d0d7e0;--dim:#6b7a8d;--accent:#FFCB05;--accent-soft:rgba(255,203,5,.15);
  --up:#3fb868;--down:#e05555;--bar-bg:#1e2632;--bar-fill:#3b6d96;
  --font-display:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'Cascadia Code',Menlo,Monaco,monospace;
}
@media(prefers-color-scheme:light){:root{
  --bg:#f0f2f5;--surface:#fff;--surface-hover:#f8f9fb;--border:#d5dae2;
  --text:#1a2030;--dim:#6b7a8d;--accent:#B8920A;--accent-soft:rgba(184,146,10,.08);
  --up:#2d9050;--down:#cc4444;--bar-bg:#e4e8ee;--bar-fill:#5a8fb8;
}}
:root[data-theme="light"]{
  --bg:#f0f2f5;--surface:#fff;--surface-hover:#f8f9fb;--border:#d5dae2;
  --text:#1a2030;--dim:#6b7a8d;--accent:#B8920A;--accent-soft:rgba(184,146,10,.08);
  --up:#2d9050;--down:#cc4444;--bar-bg:#e4e8ee;--bar-fill:#5a8fb8;
}
:root[data-theme="dark"]{
  --bg:#0e1219;--surface:#161c25;--surface-hover:#1c2330;--border:#2a3240;
  --text:#d0d7e0;--dim:#6b7a8d;--accent:#FFCB05;--accent-soft:rgba(255,203,5,.15);
  --up:#3fb868;--down:#e05555;--bar-bg:#1e2632;--bar-fill:#3b6d96;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-display);line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 60px}
header{text-align:center;padding:32px 0 28px;position:relative}
header h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;letter-spacing:-.03em;color:var(--text)}
header h1 span{color:var(--accent)}
header p{font-size:.875rem;color:var(--dim);margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.theme-toggle{position:absolute;right:0;top:12px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.theme-toggle input{display:none}
.toggle-label{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);transition:color .3s}
.toggle-label.active{color:var(--text)}
.toggle-track{width:52px;height:28px;border-radius:14px;background:var(--bar-bg);position:relative;transition:background .3s;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.toggle-knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.4,.0,.2,1);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.theme-toggle input:checked~.toggle-track .toggle-knob{transform:translateX(24px)}
.search-area{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--border)}
.search-box{position:relative}
.search-box input{width:100%;padding:12px 16px 12px 42px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;font-family:var(--font-display);outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--dim)}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.status{font-size:.8rem;color:var(--dim);padding:12px 0 4px}
.mega-list{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.mega-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .15s}
.mega-card:hover{border-color:color-mix(in srgb,var(--border) 50%,var(--accent))}
.mega-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.mega-sprites{display:flex;align-items:center;gap:4px;flex-shrink:0}
.mon-sprite{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
.sprite-arrow{color:var(--dim);font-size:.8rem}
.mega-info{flex:1;min-width:0}
.mega-name{font-size:.95rem;font-weight:600;letter-spacing:-.01em}
.mega-meta{font-size:.72rem;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;align-items:center}
.bst-change{font-weight:600}
.bst-change.up{color:var(--up)}
.type-badges{display:flex;gap:3px}
.type-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:.6rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff;line-height:1.4}
.type-Normal{background:#929da3}.type-Fire{background:#ff9d55}.type-Water{background:#5090d6}.type-Electric{background:#f4d23c;color:#333}
.type-Grass{background:#63bc5a}.type-Ice{background:#73cec0}.type-Fighting{background:#ce416b}.type-Poison{background:#ab6ac8}
.type-Ground{background:#d97845}.type-Flying{background:#8fa9de}.type-Psychic{background:#fa7179}.type-Bug{background:#91c12f;color:#333}
.type-Rock{background:#c5b78c;color:#333}.type-Ghost{background:#5269ad}.type-Dragon{background:#0b6dc3}.type-Dark{background:#5a5465}
.type-Steel{background:#5a8ea2}.type-Fairy{background:#ec8fe6}
.type-arrow{color:var(--dim);font-size:.65rem}
.expand-icon{color:var(--dim);transition:transform .2s;flex-shrink:0}
.mega-card.open .expand-icon{transform:rotate(180deg)}
.mega-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.mega-card.open .mega-body{display:block}
.stat-section{padding-top:12px}
.stat-row{display:flex;align-items:center;gap:0;padding:3px 0;font-family:var(--font-mono);font-size:.75rem;font-variant-numeric:tabular-nums}
.stat-label{width:36px;font-weight:600;color:var(--dim);text-align:right;font-size:.7rem}
.stat-base{width:30px;text-align:right;color:var(--dim);font-size:.7rem}
.stat-bar-wrap{flex:1;height:16px;background:var(--bar-bg);border-radius:3px;margin:0 8px;overflow:hidden;position:relative}
.stat-bar{position:absolute;height:7px;border-radius:3px;transition:width .3s}
.stat-bar.base-bar{top:1px;background:var(--bar-fill);opacity:.7}
.stat-bar.mega-bar{bottom:1px;background:var(--accent);opacity:.85}
.stat-mega{width:30px;text-align:right;font-weight:600;color:var(--text);font-size:.75rem}
.stat-diff{width:36px;text-align:right;font-size:.7rem;font-weight:600}
.stat-diff.up{color:var(--up)}.stat-diff.down{color:var(--down)}.stat-diff.neutral{color:var(--dim)}
.stat-legend{display:flex;gap:14px;padding:6px 0 0;font-size:.68rem;color:var(--dim)}
.stat-legend-item{display:flex;align-items:center;gap:4px}
.stat-legend-swatch{width:10px;height:6px;border-radius:2px}
.ability-section{padding-top:16px}
.ability-section h3{font-size:.78rem;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.ability-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ability-col-label{font-size:.65rem;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.ability-item{background:var(--surface-hover);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.ability-name{font-size:.82rem;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.ability-hidden{font-size:.6rem;padding:1px 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.ability-desc{font-size:.72rem;color:var(--dim);margin-top:3px;line-height:1.5}
.calc-section{padding-top:16px;border-top:1px solid var(--border);margin-top:12px}
.calc-section h3{font-size:.78rem;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.calc-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.calc-controls select{padding:5px 8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.78rem;font-family:var(--font-display);outline:none}
.calc-controls select:focus{border-color:var(--accent)}
.pts-remaining{font-size:.72rem;color:var(--dim);font-family:var(--font-mono)}
.pts-remaining .count{font-weight:600;color:var(--accent)}
.pts-remaining .over{color:var(--down)}
.calc-row{display:flex;align-items:center;gap:0;padding:3px 0;font-family:var(--font-mono);font-size:.72rem;font-variant-numeric:tabular-nums}
.calc-label{width:36px;font-weight:600;text-align:right;font-size:.7rem}
.calc-label.up{color:var(--up)}.calc-label.down{color:var(--down)}.calc-label.neutral{color:var(--dim)}
.calc-base{width:30px;text-align:right;color:var(--dim);font-size:.7rem}
.calc-pts-input{width:36px;text-align:center;padding:2px 3px;background:var(--bar-bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.7rem;font-family:var(--font-mono);outline:none}
.calc-pts-input:focus{border-color:var(--accent)}
.calc-bar-wrap{flex:1;height:10px;background:var(--bar-bg);border-radius:3px;margin:0 6px;overflow:hidden}
.calc-bar{height:100%;border-radius:3px;background:var(--accent);opacity:.85;transition:width .15s}
.calc-final{width:34px;text-align:right;font-weight:600;color:var(--text);font-size:.78rem}
@media(max-width:600px){
  .mega-sprites .mon-sprite{width:40px;height:40px}
  .ability-grid{grid-template-columns:1fr}
  .stat-base,.stat-diff{width:28px;font-size:.65rem}
  .stat-mega{width:28px;font-size:.7rem}
  .calc-controls{flex-direction:column;align-items:flex-start}
}
</style>

const SL = {hp:'HP', attack:'Atk', defense:'Def', 'special-attack':'SpA', 'special-defense':'SpD', speed:'Spe'};
const SK = {hp:'hp', attack:'at', defense:'df', 'special-attack':'sa', 'special-defense':'sd', speed:'sp'};
const STAT_ORDER = ['hp','attack','defense','special-attack','special-defense','speed'];
const MAX_STAT = 200;
const MAX_PTS = 66;
const MAX_PER_STAT = 32;
const NATURES = {
  Adamant:{up:'at',dn:'sa'},Jolly:{up:'sp',dn:'sa'},Modest:{up:'sa',dn:'at'},Timid:{up:'sp',dn:'at'},
  Bold:{up:'df',dn:'at'},Calm:{up:'sd',dn:'at'},Careful:{up:'sd',dn:'sa'},Impish:{up:'df',dn:'sa'},
  Sassy:{up:'sd',dn:'sp'},Quiet:{up:'sa',dn:'sp'},Brave:{up:'at',dn:'sp'},Relaxed:{up:'df',dn:'sp'},
  Naive:{up:'sp',dn:'sd'},Hasty:{up:'sp',dn:'df'},Lonely:{up:'at',dn:'df'},Mild:{up:'sa',dn:'df'},
  Naughty:{up:'at',dn:'sd'},Rash:{up:'sa',dn:'sd'},Gentle:{up:'sd',dn:'df'},Lax:{up:'df',dn:'sd'},
  Hardy:{},Docile:{},Serious:{},Bashful:{},Quirky:{}
};
function calcStat(base, pts, statKey, nature) {
  const nat = NATURES[nature] || {};
  const sk = SK[statKey];
  const mult = sk === nat.up ? 1.1 : sk === nat.dn ? 0.9 : 1.0;
  if (statKey === 'hp') return Math.floor((2 * base + 31) / 2) + pts + 60;
  return Math.floor((Math.floor((2 * base + 31) / 2) + 5 + pts) * mult);
}

function capitalize(s) {
  return s.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join('-');
}

function displayName(megaForm) {
  return capitalize(megaForm).replace(/-Mega/g, ' Mega').replace(/-([XYZ])$/, ' $1');
}

function baseName(pokemon) {
  return capitalize(pokemon);
}

function spriteUrl(name) {
  let s = name.toLowerCase().replace(/\s+/g, '');
  s = s.replace(/-mega-([xyz])$/, '-mega$1');
  return 'https://play.pokemonshowdown.com/sprites/dex/' + s + '.png';
}

function typeBadge(t) {
  const cap = t[0].toUpperCase() + t.slice(1);
  return '<span class="type-badge type-' + cap + '">' + cap + '</span>';
}

function renderCard(megaForm, d) {
  const baseSprite = spriteUrl(d.pokemon);
  const megaSprite = spriteUrl(megaForm);
  const bst = d.stats.bst;
  const bstSign = bst.diff > 0 ? '+' : '';

  const baseTypes = d.base_types.map(typeBadge).join('');
  const megaTypes = d.mega_types.map(typeBadge).join('');
  const typeHtml = d.type_changed
    ? '<div class="type-badges">' + baseTypes + '</div><span class="type-arrow">→</span><div class="type-badges">' + megaTypes + '</div>'
    : '<div class="type-badges">' + megaTypes + '</div>';

  let statsHtml = '';
  STAT_ORDER.forEach(sk => {
    const s = d.stats[sk];
    const diff = s.diff;
    const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'neutral';
    const sign = diff > 0 ? '+' : '';
    statsHtml += '<div class="stat-row">' +
      '<span class="stat-label">' + SL[sk] + '</span>' +
      '<span class="stat-base">' + s.base + '</span>' +
      '<div class="stat-bar-wrap">' +
        '<div class="stat-bar base-bar" style="width:' + (s.base / MAX_STAT * 100) + '%"></div>' +
        '<div class="stat-bar mega-bar" style="width:' + (s.mega / MAX_STAT * 100) + '%"></div>' +
      '</div>' +
      '<span class="stat-mega">' + s.mega + '</span>' +
      '<span class="stat-diff ' + cls + '">' + (diff === 0 ? '—' : sign + diff) + '</span>' +
    '</div>';
  });

  let baseAbilities = '';
  d.base_abilities.forEach(a => {
    const hBadge = a.hidden ? '<span class="ability-hidden">HA</span>' : '';
    baseAbilities += '<div class="ability-item"><div class="ability-name">' + capitalize(a.name) + hBadge + '</div><div class="ability-desc">' + a.desc + '</div></div>';
  });

  let megaAbilities = '';
  d.mega_abilities.forEach(a => {
    megaAbilities += '<div class="ability-item"><div class="ability-name">' + capitalize(a.name) + '</div><div class="ability-desc">' + a.desc + '</div></div>';
  });

  return '<div class="mega-card" data-name="' + megaForm + '" data-pokemon="' + d.pokemon + '">' +
    '<div class="mega-header">' +
      '<div class="mega-sprites">' +
        '<img class="mon-sprite" src="' + baseSprite + '" alt="' + baseName(d.pokemon) + '" loading="lazy">' +
        '<span class="sprite-arrow">→</span>' +
        '<img class="mon-sprite" src="' + megaSprite + '" alt="?" loading="lazy" onerror="this.style.opacity=0.15;this.src=\'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7\';this.onerror=null">' +
      '</div>' +
      '<div class="mega-info">' +
        '<div class="mega-name">' + displayName(megaForm) + '</div>' +
        '<div class="mega-meta">' + typeHtml + '<span class="bst-change up">' + bstSign + bst.diff + ' BST (' + bst.base + ' → ' + bst.mega + ')</span></div>' +
      '</div>' +
      '<svg class="expand-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>' +
    '</div>' +
    '<div class="mega-body">' +
      '<div class="stat-section">' + statsHtml +
        '<div class="stat-legend">' +
          '<span class="stat-legend-item"><span class="stat-legend-swatch" style="background:var(--bar-fill);opacity:.7"></span>Base</span>' +
          '<span class="stat-legend-item"><span class="stat-legend-swatch" style="background:var(--accent);opacity:.85"></span>Mega</span>' +
        '</div>' +
      '</div>' +
      '<div class="calc-section"><h3>Stat Calculator (Lv. 50)</h3>' +
        '<div class="calc-controls">' +
          '<select class="nature-select" data-mega="' + megaForm + '">' +
            Object.keys(NATURES).map(n => {
              const nat = NATURES[n];
              const label = nat.up ? n + ' (+' + {at:'Atk',df:'Def',sa:'SpA',sd:'SpD',sp:'Spe'}[nat.up] + ' -' + {at:'Atk',df:'Def',sa:'SpA',sd:'SpD',sp:'Spe'}[nat.dn] + ')' : n;
              return '<option value="' + n + '">' + label + '</option>';
            }).join('') +
          '</select>' +
          '<span class="pts-remaining">Points: <span class="count" data-pts-display="' + megaForm + '">0</span> / ' + MAX_PTS + '</span>' +
        '</div>' +
        '<div class="calc-rows" data-calc="' + megaForm + '">' +
          STAT_ORDER.map(sk => {
            const base = d.stats[sk].mega;
            const defNat = Object.keys(NATURES)[0];
            const defNatObj = NATURES[defNat] || {};
            const final0 = calcStat(base, 0, sk, defNat);
            const skk = SK[sk];
            const cls = skk === defNatObj.up ? 'up' : skk === defNatObj.dn ? 'down' : 'neutral';
            return '<div class="calc-row" data-stat="' + sk + '" data-base="' + base + '">' +
              '<span class="calc-label ' + cls + '">' + SL[sk] + '</span>' +
              '<span class="calc-base">' + base + '</span>' +
              '<input class="calc-pts-input" type="number" min="0" max="' + MAX_PER_STAT + '" value="0" data-stat="' + sk + '">' +
              '<div class="calc-bar-wrap"><div class="calc-bar" style="width:' + (final0 / 250 * 100) + '%"></div></div>' +
              '<span class="calc-final">' + final0 + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<div class="ability-section"><h3>Abilities</h3>' +
        '<div class="ability-grid">' +
          '<div><div class="ability-col-label">' + baseName(d.pokemon) + '</div>' + baseAbilities + '</div>' +
          '<div><div class="ability-col-label">' + displayName(megaForm) + '</div>' + megaAbilities + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

const listEl = document.getElementById('list');
const statusEl = document.getElementById('status');
const searchEl = document.getElementById('search');

const sorted = Object.keys(DATA).sort((a, b) => {
  const pa = DATA[a].pokemon, pb = DATA[b].pokemon;
  if (pa !== pb) return pa.localeCompare(pb);
  return a.localeCompare(b);
});

function render(filter) {
  const q = (filter || '').toLowerCase().trim();
  const matches = sorted.filter(k => {
    if (!q) return true;
    return k.includes(q) || DATA[k].pokemon.includes(q) ||
      DATA[k].base_types.some(t => t.includes(q)) ||
      DATA[k].mega_types.some(t => t.includes(q));
  });
  statusEl.textContent = matches.length + ' of ' + sorted.length + ' mega forms';
  listEl.innerHTML = matches.map(k => renderCard(k, DATA[k])).join('');

  if (!q && matches.length > 0) {
    const charizardCards = listEl.querySelectorAll('[data-pokemon="charizard"]');
    charizardCards.forEach(c => c.classList.add('open'));
  }
}

render('');

listEl.addEventListener('click', e => {
  const header = e.target.closest('.mega-header');
  if (header) header.closest('.mega-card').classList.toggle('open');
});

searchEl.addEventListener('input', e => render(e.target.value));

function updateCalc(megaForm) {
  const container = listEl.querySelector('[data-calc="' + megaForm + '"]');
  if (!container) return;
  const select = listEl.querySelector('.nature-select[data-mega="' + megaForm + '"]');
  const nature = select ? select.value : 'Hardy';
  const nat = NATURES[nature] || {};
  const inputs = container.querySelectorAll('.calc-pts-input');
  let total = 0;
  inputs.forEach(inp => { total += parseInt(inp.value) || 0; });
  const display = listEl.querySelector('[data-pts-display="' + megaForm + '"]');
  if (display) {
    display.textContent = total;
    display.className = total > MAX_PTS ? 'count over' : 'count';
  }
  container.querySelectorAll('.calc-row').forEach(row => {
    const sk = row.dataset.stat;
    const base = parseInt(row.dataset.base);
    const pts = parseInt(row.querySelector('.calc-pts-input').value) || 0;
    const final_ = calcStat(base, pts, sk, nature);
    row.querySelector('.calc-final').textContent = final_;
    row.querySelector('.calc-bar').style.width = Math.min(final_ / 250 * 100, 100) + '%';
    const label = row.querySelector('.calc-label');
    const skk = SK[sk];
    label.className = 'calc-label ' + (skk === nat.up ? 'up' : skk === nat.dn ? 'down' : 'neutral');
  });
}

listEl.addEventListener('input', e => {
  if (e.target.classList.contains('calc-pts-input')) {
    let v = parseInt(e.target.value) || 0;
    if (v < 0) v = 0;
    if (v > MAX_PER_STAT) v = MAX_PER_STAT;
    e.target.value = v;
    const card = e.target.closest('.mega-card');
    updateCalc(card.dataset.name);
  }
});

listEl.addEventListener('change', e => {
  if (e.target.classList.contains('nature-select')) {
    updateCalc(e.target.dataset.mega);
  }
});

const cb = document.getElementById('theme-cb');
let stored = null;
try { stored = localStorage.getItem('theme'); } catch(e) {}
if (stored) {
  document.documentElement.setAttribute('data-theme', stored);
  cb.checked = stored === 'light';
} else {
  const isLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  cb.checked = isLight;
}
function updateLabels() {
  document.getElementById('tl-dark').classList.toggle('active', !cb.checked);
  document.getElementById('tl-light').classList.toggle('active', cb.checked);
}
updateLabels();
cb.addEventListener('change', () => {
  const theme = cb.checked ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('theme', theme); } catch(e) {}
  updateLabels();
});
</script>
