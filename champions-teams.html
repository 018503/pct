<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokemon Champions &mdash; Team Browser</title>
<style>
:root {
  --bg:#0e1219;--surface:#161c25;--surface-hover:#1c2330;--border:#2a3240;
  --text:#d0d7e0;--dim:#6b7a8d;--accent:#FFCB05;--accent-soft:rgba(255,203,5,.15);
  --up:#3fb868;--down:#e05555;--bar-bg:#1e2632;--bar-fill:#3b6d96;
  --font-display:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'Cascadia Code',Menlo,Monaco,monospace;
}
@media(prefers-color-scheme:light){:root{
  --bg:#f0f2f5;--surface:#fff;--surface-hover:#f8f9fb;--border:#d5dae2;
  --text:#1a2030;--dim:#6b7a8d;--accent:#B8920A;--accent-soft:rgba(184,146,10,.08);
  --up:#2d9050;--down:#cc4444;--bar-bg:#e4e8ee;--bar-fill:#5a8fb8;
}}
:root[data-theme="light"]{
  --bg:#f0f2f5;--surface:#fff;--surface-hover:#f8f9fb;--border:#d5dae2;
  --text:#1a2030;--dim:#6b7a8d;--accent:#B8920A;--accent-soft:rgba(184,146,10,.08);
  --up:#2d9050;--down:#cc4444;--bar-bg:#e4e8ee;--bar-fill:#5a8fb8;
}
:root[data-theme="dark"]{
  --bg:#0e1219;--surface:#161c25;--surface-hover:#1c2330;--border:#2a3240;
  --text:#d0d7e0;--dim:#6b7a8d;--accent:#FFCB05;--accent-soft:rgba(255,203,5,.15);
  --up:#3fb868;--down:#e05555;--bar-bg:#1e2632;--bar-fill:#3b6d96;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-display);line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
header{text-align:center;padding:32px 0 28px}
header h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;letter-spacing:-.03em;color:var(--text)}
header h1 span{color:var(--accent)}
header p{font-size:.875rem;color:var(--dim);margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.search-area{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--border)}
.search-box{position:relative}
.search-box input{width:100%;padding:12px 16px 12px 42px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;font-family:var(--font-display);outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--dim)}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 4px;min-height:30px;align-items:center}
.filter-bar:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;font-size:.75rem;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--surface);color:var(--dim)}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .count{opacity:.6;font-size:.7rem}
.clear-btn{font-size:.75rem;color:var(--accent);cursor:pointer;padding:4px 8px;background:none;border:none;font-family:var(--font-display)}
.clear-btn:hover{text-decoration:underline}
.status{font-size:.8rem;color:var(--dim);padding:12px 0 4px}
.team-list{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.team-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .15s}
.team-card:hover{border-color:color-mix(in srgb,var(--border) 50%,var(--accent))}
.team-card.dimmed{opacity:.35;pointer-events:none}
.team-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.tourney-badge{font-size:.68rem;padding:1px 7px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.02em}
.top-filters{display:flex;gap:6px;padding:0 0 12px;flex-wrap:wrap;align-items:center}
.top-filters .chip{font-size:.72rem}
.filter-label{font-size:.68rem;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.team-info{flex:1;min-width:0}
.team-name{font-size:.95rem;font-weight:600;letter-spacing:-.01em}
.team-meta{font-size:.72rem;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.team-meta a{color:var(--dim);text-decoration:none}
.team-meta a:hover{color:var(--accent)}
.reg-badge{font-size:.68rem;padding:1px 7px;border-radius:8px;background:var(--bar-bg);color:var(--dim);font-weight:600;letter-spacing:.02em}
.team-pokemon{display:flex;flex-wrap:wrap;gap:4px}
.mon-pill{font-size:.68rem;padding:2px 7px;border-radius:10px;background:var(--bar-bg);color:var(--dim);white-space:nowrap;transition:all .15s}
.mon-pill.hl{background:var(--accent-soft);color:var(--accent);font-weight:600}
.expand-icon{color:var(--dim);transition:transform .2s;flex-shrink:0}
.team-card.open .expand-icon{transform:rotate(180deg)}
.team-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.team-card.open .team-body{display:block}
.strategy{font-size:.82rem;color:var(--dim);padding:12px 0;line-height:1.6;max-width:80ch}
.mon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.mon-card{background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;padding:12px}
.mon-card.hl{border-color:var(--accent);background:var(--accent-soft)}
.mon-species{font-size:.88rem;font-weight:600}
.mon-nature{font-size:.72rem;color:var(--dim)}
.mon-sub{font-size:.72rem;color:var(--dim)}
.stat-row{display:flex;align-items:center;gap:0;padding:1px 0;font-family:var(--font-mono);font-size:.72rem;font-variant-numeric:tabular-nums}
.stat-label{width:28px;font-weight:600;color:var(--dim);text-align:right;font-size:.68rem}
.stat-label.up{color:var(--up)}.stat-label.down{color:var(--down)}
.stat-base{width:28px;text-align:right;color:var(--dim);font-size:.68rem}
.stat-pts{width:22px;text-align:right;color:var(--dim);font-size:.65rem;opacity:.6}
.stat-bar-wrap{flex:1;height:10px;background:var(--bar-bg);border-radius:3px;margin:0 6px;overflow:hidden}
.stat-bar{height:100%;border-radius:3px;background:var(--bar-fill);transition:width .3s}
.stat-final{width:30px;text-align:right;font-weight:600;color:var(--text);font-size:.75rem}
.mon-moves{font-size:.72rem;color:var(--dim);padding-top:6px;border-top:1px solid var(--border);margin-top:6px;display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.rental{font-family:var(--font-mono);font-size:.72rem;cursor:pointer;padding:1px 5px;border-radius:3px;background:var(--bar-bg);color:var(--dim);border:none;transition:all .15s}
.rental:hover{color:var(--accent);background:var(--accent-soft)}
.rental.copied{color:var(--up)}
.links{display:flex;gap:8px;font-size:.72rem;padding-top:8px}
.links a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent}
.links a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.compare-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:12px 0 4px;overflow:hidden}
.compare-title{font-size:.82rem;font-weight:600;padding:12px 16px 8px;color:var(--text);display:flex;align-items:baseline;gap:8px}
.compare-title span{font-size:.72rem;color:var(--dim);font-weight:400}
.compare-scroll{overflow-x:auto}
.compare-table{width:100%;border-collapse:collapse;font-size:.75rem;font-variant-numeric:tabular-nums}
.compare-table th{text-align:left;padding:6px 10px;font-size:.68rem;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.compare-table th.stat-col{text-align:right;min-width:36px}
.compare-table td{padding:5px 10px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text)}
.compare-table tr:last-child td{border-bottom:none}
.compare-table tr:hover td{background:var(--surface-hover)}
.compare-table .c-team{font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--accent)}
.compare-table .c-team:hover{text-decoration:underline}
.compare-table .c-nature{color:var(--dim)}
.compare-table .c-item{color:var(--dim)}
.compare-table .c-stat{text-align:right;font-family:var(--font-mono);font-size:.72rem}
.compare-table .c-stat.is-max{color:var(--accent);font-weight:700}
.compare-table .c-stat .pts{font-size:.62rem;color:var(--dim);margin-right:2px}
.compare-table .c-moves{font-size:.68rem;color:var(--dim);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.compare-table .c-stat.up{color:var(--up)}.compare-table .c-stat.down{color:var(--down)}
.compare-range{display:flex;gap:2px;align-items:center;justify-content:flex-end}
.compare-minibar{width:32px;height:6px;background:var(--bar-bg);border-radius:2px;overflow:hidden}
.compare-minibar div{height:100%;background:var(--bar-fill);border-radius:2px}
@media(max-width:700px){
  .mon-grid{grid-template-columns:1fr}
  .team-pokemon{display:none}
  .team-header{padding:12px 14px}
  .compare-table .c-moves{display:none}
}
.type-badges{display:flex;gap:3px;margin-top:4px}
.type-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:.6rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff;line-height:1.4}
.type-Normal{background:#929da3}.type-Fire{background:#ff9d55}.type-Water{background:#5090d6}.type-Electric{background:#f4d23c;color:#333}
.type-Grass{background:#63bc5a}.type-Ice{background:#73cec0}.type-Fighting{background:#ce416b}.type-Poison{background:#ab6ac8}
.type-Ground{background:#d97845}.type-Flying{background:#8fa9de}.type-Psychic{background:#fa7179}.type-Bug{background:#91c12f;color:#333}
.type-Rock{background:#c5b78c;color:#333}.type-Ghost{background:#5269ad}.type-Dragon{background:#0b6dc3}.type-Dark{background:#5a5465}
.type-Steel{background:#5a8ea2}.type-Fairy{background:#ec8fe6}
.mon-sprite{width:56px;height:56px;object-fit:contain;image-rendering:pixelated;flex-shrink:0}
.mon-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}
.mon-top-left{display:flex;align-items:center;gap:8px;min-width:0}
.mon-top-right{text-align:right;flex-shrink:0}
.pill-sprite{width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:1px;image-rendering:pixelated}
.item-sprite{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;margin-right:2px}
.item-sprite-sm{width:16px;height:16px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;margin-right:2px}
.move-entry{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.mt-icon{width:18px;height:18px;border-radius:4px;object-fit:cover;object-position:left center;flex-shrink:0}
.mt-icon-sm{width:14px;height:14px;border-radius:3px;object-fit:cover;object-position:left center;flex-shrink:0}
.histogram-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:12px 0 4px;overflow:hidden}
.histogram-header{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.histogram-sprite{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
.histogram-title{font-size:.88rem;font-weight:600;color:var(--text)}
.histogram-title span{font-size:.72rem;color:var(--dim);font-weight:400;margin-left:4px}
.histogram-chart{display:flex;padding:12px 16px 16px;gap:6px}
.histogram-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.histogram-val{font-size:.78rem;font-weight:700;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text);line-height:1}
.histogram-range-text{font-size:.56rem;color:var(--dim);font-family:var(--font-mono);font-variant-numeric:tabular-nums;line-height:1}
.histogram-bar-area{width:100%;height:140px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.histogram-bar{width:65%;max-width:52px;border-radius:4px 4px 0 0;min-height:2px;position:relative;z-index:1}
.histogram-range-bar{position:absolute;width:65%;max-width:52px;border-radius:3px;opacity:.18;z-index:0}
.histogram-label{font-size:.7rem;font-weight:600;color:var(--dim);letter-spacing:.03em}
.histogram-median-label{font-size:.56rem;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.histogram-profile{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 16px 16px;border-top:1px solid var(--border);margin-top:4px;padding-top:12px}
.histogram-profile-col h4{font-size:.7rem;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.histogram-freq-row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:.72rem}
.histogram-freq-name{min-width:0;flex-shrink:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.histogram-freq-bar-wrap{flex:1;height:6px;background:var(--bar-bg);border-radius:3px;overflow:hidden;min-width:24px}
.histogram-freq-bar{height:100%;border-radius:3px;background:var(--accent);opacity:.7}
.histogram-freq-count{font-size:.65rem;color:var(--dim);font-family:var(--font-mono);font-variant-numeric:tabular-nums;flex-shrink:0}
@media(max-width:500px){
  .histogram-bar-area{height:100px}
  .histogram-val{font-size:.68rem}
  .histogram-label{font-size:.6rem}
  .histogram-sprite{width:36px;height:36px}
  .histogram-profile{grid-template-columns:1fr;gap:12px}
}
.theme-toggle{position:absolute;right:0;top:12px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.theme-toggle input{display:none}
.toggle-label{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);transition:color .3s}
.toggle-label.active{color:var(--text)}
.toggle-track{width:52px;height:28px;border-radius:14px;background:var(--bar-bg);position:relative;transition:background .3s;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.toggle-knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.4,.0,.2,1);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle-knob::before,.toggle-knob::after{content:'';position:absolute;border-radius:50%;background:rgba(0,0,0,.08);transition:opacity .3s}
.toggle-knob::before{width:5px;height:5px;top:5px;right:4px}
.toggle-knob::after{width:3px;height:3px;bottom:5px;right:7px}
.theme-toggle input:checked~.toggle-track{background:var(--accent)}
.theme-toggle input:checked~.toggle-track .toggle-knob{transform:translateX(24px)}
@media(max-width:500px){
  .theme-toggle{position:static;transform:none;margin:10px auto 0;justify-content:center}
  header[style]{text-align:center}
}
</style>

// Build unique Pokemon index
const pokemonIndex = {};
T.forEach((team, ti) => {
  team.p.forEach(mon => {
    const name = mon[6] || mon[0]; // mega form or base
    const displayName = mon[0];
    const key = name.toLowerCase();
    if (!pokemonIndex[key]) pokemonIndex[key] = { name, displayName, teams: [] };
    pokemonIndex[key].teams.push(ti);
    // Also index by base name if different
    if (mon[6]) {
      const baseKey = mon[0].toLowerCase();
      if (!pokemonIndex[baseKey]) pokemonIndex[baseKey] = { name: mon[0], displayName: mon[0], teams: [] };
      if (!pokemonIndex[baseKey].teams.includes(ti)) pokemonIndex[baseKey].teams.push(ti);
    }
  });
});

let activeFilter = null;
let regFilter = 'all';
let tourneyFilter = 'all';

function getTeamReg(team){return (team.reg||'MB').replace(/ S\d$/,'');}
function isTourney(team){return !!team.rk;}

function isTeamVisible(t){
  const r=getTeamReg(t);
  if(regFilter!=='all'&&r!==regFilter)return false;
  if(tourneyFilter==='tourney'&&!isTourney(t))return false;
  if(tourneyFilter==='community'&&isTourney(t))return false;
  return true;
}

function renderTopFilters(){
  const regCounts={all:0,MA:0,MB:0};
  const tnCounts={all:0,tourney:0,community:0};
  T.forEach(t=>{
    const r=getTeamReg(t);
    const tn=isTourney(t);
    if(tourneyFilter==='all'||(tourneyFilter==='tourney'&&tn)||(tourneyFilter==='community'&&!tn)){
      regCounts[r]=(regCounts[r]||0)+1;regCounts.all++;
    }
    if(regFilter==='all'||r===regFilter){
      if(tn)tnCounts.tourney++;else tnCounts.community++;tnCounts.all++;
    }
  });
  const el=document.getElementById('top-filters');
  const chips=[
    {k:'_label',l:'Regulation'},
    {k:'all',g:'reg',l:'All',c:regCounts.all},
    {k:'MA',g:'reg',l:'MA',c:regCounts.MA},
    {k:'MB',g:'reg',l:'MB',c:regCounts.MB},
    {k:'_sep'},
    {k:'_label',l:'Type'},
    {k:'all',g:'tn',l:'All',c:tnCounts.all},
    {k:'tourney',g:'tn',l:'Tournament',c:tnCounts.tourney},
    {k:'community',g:'tn',l:'Ladder',c:tnCounts.community},
  ];
  el.innerHTML=chips.map(c=>{
    if(c.k==='_sep')return '<span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span>';
    if(c.k==='_label')return `<span class="filter-label">${c.l}</span>`;
    const active=(c.g==='reg'&&regFilter===c.k)||(c.g==='tn'&&tourneyFilter===c.k);
    return `<span class="chip${active?' active':''}" data-group="${c.g}" data-key="${c.k}">${c.l} <span class="count">(${c.c})</span></span>`;
  }).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    if(c.dataset.group==='reg')regFilter=c.dataset.key;
    else tourneyFilter=c.dataset.key;
    renderTopFilters();
    renderTeams();
  });
}
renderTopFilters();

function renderChips(query) {
  const el = document.getElementById('chips');
  if (!query) { el.innerHTML = ''; return; }
  const q = query.toLowerCase();
  const matches = Object.entries(pokemonIndex)
    .filter(([k, v]) => k.includes(q) || v.name.toLowerCase().includes(q))
    .sort((a, b) => b[1].teams.length - a[1].teams.length)
    .slice(0, 20);
  el.innerHTML = matches.map(([k, v]) =>
    `<span class="chip${activeFilter===k?' active':''}" data-key="${k}">${v.name} <span class="count">(${v.teams.length})</span></span>`
  ).join('') + (activeFilter ? '<button class="clear-btn" onclick="clearFilter()">Clear filter</button>' : '');
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => toggleFilter(c.dataset.key));
}

function toggleFilter(key) {
  activeFilter = activeFilter === key ? null : key;
  renderChips(document.getElementById('search').value);
  renderTeams();
}

function clearFilter() {
  activeFilter = null;
  document.getElementById('search').value = '';
  renderChips('');
  regFilter='all';tourneyFilter='all';
  renderTopFilters();
  renderTeams();
}

const STAT_COLORS=['#FF5959','#F5AC78','#FAE078','#9DB7F5','#A7DB8D','#FA92B2'];
function statMedian(arr){const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}
function freqCount(arr){const m={};arr.forEach(v=>{m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function freqRows(entries,total,max,fmt){
  return entries.slice(0,max).map(([name,count])=>{
    const pct=count/total*100;
    const display=fmt?fmt(name):name;
    return `<div class="histogram-freq-row"><span class="histogram-freq-name">${display}</span><div class="histogram-freq-bar-wrap"><div class="histogram-freq-bar" style="width:${pct}%"></div></div><span class="histogram-freq-count">${count}</span></div>`;
  }).join('');
}
function renderHistogram(){
  const el=document.getElementById('histogram');
  if(!activeFilter){el.innerHTML='';return;}
  const info=pokemonIndex[activeFilter];
  if(!info||info.teams.length<1){el.innerHTML='';return;}
  const visTeams=info.teams.filter(ti=>isTeamVisible(T[ti]));
  const monData=visTeams.map(ti=>{
    const mon=T[ti].p.find(m=>(m[6]||m[0]).toLowerCase()===activeFilter||m[0].toLowerCase()===activeFilter);
    if(!mon)return null;
    return {stats:[mon[4][2],mon[4][5],mon[4][8],mon[4][11],mon[4][14],mon[4][17]],nature:mon[3],item:mon[1],moves:mon[5]};
  }).filter(Boolean);
  if(!monData.length){el.innerHTML='';return;}
  const H=140,MAX=250;
  const meds=SL.map((_,i)=>statMedian(monData.map(b=>b.stats[i])));
  const mins=SL.map((_,i)=>Math.min(...monData.map(b=>b.stats[i])));
  const maxes=SL.map((_,i)=>Math.max(...monData.map(b=>b.stats[i])));
  const monName=info.name;
  const cols=SL.map((label,i)=>{
    const medH=Math.max(meds[i]/MAX*H,2);
    const hasRange=monData.length>1&&mins[i]!==maxes[i];
    const minH=mins[i]/MAX*H;
    const maxH=maxes[i]/MAX*H;
    const rangeBar=hasRange?`<div class="histogram-range-bar" style="bottom:${minH}px;height:${maxH-minH}px;background:${STAT_COLORS[i]}"></div>`:'';
    const rangeText=hasRange?`<div class="histogram-range-text">${mins[i]}&ndash;${maxes[i]}</div>`:'';
    return `<div class="histogram-col">
      <div class="histogram-val">${meds[i]}</div>
      ${rangeText}
      <div class="histogram-bar-area">
        ${rangeBar}
        <div class="histogram-bar" style="height:${medH}px;background:${STAT_COLORS[i]}"></div>
      </div>
      <div class="histogram-label">${label}</div>
    </div>`;
  }).join('');
  const n=monData.length;
  const natures=freqCount(monData.map(d=>d.nature));
  const items=freqCount(monData.map(d=>d.item));
  const allMoves=monData.flatMap(d=>d.moves);
  const moves=freqCount(allMoves);
  const profile=`<div class="histogram-profile">
    <div class="histogram-profile-col"><h4>Nature</h4>${freqRows(natures,n,5)}</div>
    <div class="histogram-profile-col"><h4>Item</h4>${freqRows(items,n,5,name=>'<img class="item-sprite-sm" src="'+itemSpriteUrl(name)+'" onerror="this.style.display=\'none\'" alt="" loading="lazy">'+name)}</div>
    <div class="histogram-profile-col"><h4>Top Moves</h4>${freqRows(moves,n,6,name=>{const t=MT[name]||'Normal';return '<img class="mt-icon-sm" src="'+typeIconUrl(t)+'" alt="" loading="lazy" style="margin-right:3px;vertical-align:middle">'+name;})}</div>
  </div>`;
  el.innerHTML=`<div class="histogram-panel">
    <div class="histogram-header">
      <img class="histogram-sprite" src="${spriteUrl(monName)}" onerror="this.style.display='none'" alt="${monName}">
      <div class="histogram-title">${monName}<span>${n} build${n>1?'s':''}</span></div>
    </div>
    <div class="histogram-median-label" style="text-align:center;padding-top:8px">Median Stats</div>
    <div class="histogram-chart">${cols}</div>
    ${profile}
  </div>`;
}

function renderTeams() {
  const el = document.getElementById('teams');
  const status = document.getElementById('status');
  const filtered = activeFilter ? pokemonIndex[activeFilter]?.teams || [] : null;
  const visible = T.map(t=>isTeamVisible(t));
  const visCount=visible.filter(Boolean).length;
  if (filtered) {
    const fVis=filtered.filter(i=>visible[i]).length;
    status.textContent = `Showing ${fVis} of ${visCount} teams containing ${pokemonIndex[activeFilter].name}`;
  } else {
    status.textContent = `${visCount} teams`;
  }

  renderHistogram();
  renderCompare();

  el.innerHTML = T.map((team, ti) => {
    if(!visible[ti])return '';
    const dimmed = filtered && !filtered.includes(ti);
    const highlightMons = activeFilter ? pokemonIndex[activeFilter]?.teams.includes(ti) : false;
    const reg = (team.reg||'MB').replace(/ S\d$/,'');
    let tn = '';
    if (team.rk) {
      if (team.rk.includes('Japan')) tn = 'Japan Nationals';
      else if (team.vid==='9m1QefuvaE8'||team.vid==='2Ngj5VVRn2c') tn = '6K Tournament';
      else if (team.vid==='lzF98fRb2_g') tn = 'Indianapolis Regionals';
      else if (team.vid==='nl7J2IYG2Ic') tn = 'S2 Ladder';
      else if (/Top 100|547th/.test(team.rk)) tn = 'Ranked Ladder';
    }
    const rkClean = team.rk ? team.rk.replace(/ \(.*\)/,'') : '';
    return `<div class="team-card${dimmed?' dimmed':''}" data-idx="${ti}">
      <div class="team-header" onclick="toggleTeam(${ti})">
        <div class="team-info">
          <div class="team-name">${team.n}</div>
          <div class="team-meta">
            <span class="reg-badge">${reg}</span>
            ${tn?`<span class="tourney-badge">${rkClean} · ${tn}</span>`:''}
            ${team.c?`<a href="${team.cu}" target="_blank">@${team.c}</a>`:''}
            ${team.rc?`<button class="rental" onclick="event.stopPropagation();copyRental(this,'${team.rc}')" title="Copy rental code">${team.rc}</button>`:''}
          </div>
        </div>
        <div class="team-pokemon">${team.p.map(m => {
          const monName = m[6]||m[0];
          const isHl = highlightMons && activeFilter && (monName.toLowerCase()===activeFilter || m[0].toLowerCase()===activeFilter);
          return `<span class="mon-pill${isHl?' hl':''}"><img class="pill-sprite" src="${spriteUrl(monName)}" onerror="this.src=spriteUrl('${m[0]}')" alt="" loading="lazy">${m[6]||m[0]}</span>`;
        }).join('')}</div>
        <svg class="expand-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="team-body">
        <div class="strategy">${team.s}</div>
        <div class="mon-grid">${team.p.map(m => renderMon(m, highlightMons)).join('')}</div>
        <div class="links">
          <a href="${team.pp}" target="_blank">Pokepaste</a>
          <a href="https://www.youtube.com/watch?v=${team.vid||'nl7J2IYG2Ic'}&t=${timeToSec(team.vt)}" target="_blank">Video (${team.vt})</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderMon(m, hlActive) {
  const [species,item,ability,nature,stats,moves,mega]=m;
  const nat=NATURES[nature]||{};
  const monName=mega||species;
  const isHl=hlActive&&activeFilter&&(monName.toLowerCase()===activeFilter||species.toLowerCase()===activeFilter);
  let rows='';
  for(let i=0;i<6;i++){
    const base=stats[i*3],pts=stats[i*3+1],final_=stats[i*3+2];
    const sk=SK[i];
    const cls=sk===nat.up?'up':sk===nat.dn?'down':'';
    const pct=Math.min(final_/250*100,100);
    rows+=`<div class="stat-row"><span class="stat-label ${cls}">${SL[i]}</span><span class="stat-base">${base}</span><span class="stat-pts">${pts||'-'}</span><div class="stat-bar-wrap"><div class="stat-bar" style="width:${pct}%"></div></div><span class="stat-final">${final_}</span></div>`;
  }
  const natStr=nat.up?`${nature} (+${SL[SK.indexOf(nat.up)]} -${SL[SK.indexOf(nat.dn)]})`:(nature||'Neutral');
  return `<div class="mon-card${isHl?' hl':''}">
    <div class="mon-top"><div class="mon-top-left"><img class="mon-sprite" src="${spriteUrl(monName)}" onerror="this.src=spriteUrl('${species}')" alt="${monName}" loading="lazy"><div><span class="mon-species">${mega?mega:species}</span><div class="type-badges">${typeBadges(monName)}</div></div></div><div class="mon-top-right"><span class="mon-nature">${natStr}</span><div class="mon-sub">${item?'<img class="item-sprite-sm" src="'+itemSpriteUrl(item)+'" onerror="this.style.display=\'none\'" alt="" loading="lazy">'+item:'No Item'} &middot; ${ability}</div></div></div>
    ${rows}
    <div class="mon-moves">${moves.map(m=>moveHtml(m)).join('')}</div>
  </div>`;
}

function renderCompare() {
  const el = document.getElementById('compare');
  if (!activeFilter) { el.innerHTML = ''; return; }
  const info = pokemonIndex[activeFilter];
  if (!info || info.teams.length < 2) { el.innerHTML = ''; return; }
  const visTeams = info.teams.filter(ti => isTeamVisible(T[ti]));
  if (visTeams.length < 2) { el.innerHTML = ''; return; }

  const builds = visTeams.map(ti => {
    const team = T[ti];
    const mon = team.p.find(m => (m[6]||m[0]).toLowerCase() === activeFilter || m[0].toLowerCase() === activeFilter);
    if (!mon) return null;
    const [species,item,ability,nature,stats,moves,mega] = mon;
    const nat = NATURES[nature] || {};
    const finals = [stats[2],stats[5],stats[8],stats[11],stats[14],stats[17]];
    const pts = [stats[1],stats[4],stats[7],stats[10],stats[13],stats[16]];
    return { ti, team, species, item, ability, nature, nat, finals, pts, moves, mega };
  }).filter(Boolean);

  const maxes = [0,1,2,3,4,5].map(i => Math.max(...builds.map(b => b.finals[i])));

  const rows = builds.map(b => {
    const statCells = [0,1,2,3,4,5].map(i => {
      const sk = SK[i];
      const cls = sk===b.nat.up ? 'up' : sk===b.nat.dn ? 'down' : '';
      const isMax = b.finals[i] === maxes[i] && builds.length > 1 ? ' is-max' : '';
      const pct = Math.min(b.finals[i]/250*100, 100);
      return `<td class="c-stat ${cls}${isMax}"><div class="compare-range"><span class="pts">${b.pts[i]||'-'}</span><span>${b.finals[i]}</span><span class="compare-minibar"><div style="width:${pct}%"></div></span></div></td>`;
    }).join('');

    return `<tr>
      <td class="c-team" onclick="clearFilter();setTimeout(()=>{toggleTeam(${b.ti});document.querySelectorAll('.team-card')[${b.ti}].scrollIntoView({behavior:'smooth',block:'center'})},50)">${b.team.n}</td>
      <td class="c-nature">${b.nature}</td>
      <td class="c-item">${b.item?'<img class="item-sprite-sm" src="'+itemSpriteUrl(b.item)+'" onerror="this.style.display=\'none\'" alt="" loading="lazy">'+b.item:''}</td>
      <td class="c-item">${b.ability}</td>
      ${statCells}
      <td class="c-moves">${b.moves.map(m=>moveHtmlSm(m)).join(' ')}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `<div class="compare-panel">
    <div class="compare-title">${info.name} Builds <span>${builds.length} teams</span></div>
    <div class="compare-scroll"><table class="compare-table">
      <thead><tr><th>Team</th><th>Nature</th><th>Item</th><th>Ability</th>${SL.map(s=>`<th class="stat-col">${s}</th>`).join('')}<th>Moves</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function toggleTeam(idx){
  document.querySelectorAll('.team-card').forEach((c,i)=>{
    if(i===idx)c.classList.toggle('open');
    else c.classList.remove('open');
  });
}

function copyRental(el,code){
  navigator.clipboard.writeText(code).then(()=>{
    el.textContent='Copied!';el.classList.add('copied');
    setTimeout(()=>{el.textContent=code;el.classList.remove('copied')},1200);
  });
}

function timeToSec(t){const p=t.split(':');return p.length===2?+p[0]*60+ +p[1]:+p[0]*3600+ +p[1]*60+ +p[2];}

document.getElementById('search').addEventListener('input',e=>{
  renderChips(e.target.value);
  if(!e.target.value)clearFilter();
});

renderTeams();

function getEffectiveTheme(){
  const t=document.documentElement.getAttribute('data-theme');
  if(t) return t;
  return matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
}
function syncSwitch(){
  const isDark=getEffectiveTheme()==='dark';
  document.getElementById('theme-switch').checked=isDark;
  document.getElementById('label-light').classList.toggle('active',!isDark);
  document.getElementById('label-dark').classList.toggle('active',isDark);
}
function toggleTheme(){
  const next=document.getElementById('theme-switch').checked?'dark':'light';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
  syncSwitch();
}
(function(){
  const saved=localStorage.getItem('theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);}
  syncSwitch();
})();
</script>
